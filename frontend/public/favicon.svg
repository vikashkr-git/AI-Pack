<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pouchGrad" x1="12" y1="8" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd905" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff64d5" />
    </linearGradient>
    <linearGradient id="filmLayer" x1="18" y1="20" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffd905" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Protective Barrier Pouch Silhouette -->
  <path d="M16 12C16 10.3431 17.3431 9 19 9H45C46.6569 9 48 10.3431 48 12L51 46C51.2 48.5 49.5 52 46 54C42 56.5 22 56.5 18 54C14.5 52 12.8 48.5 13 46L16 12Z" 
